<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thor Lightning — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1626; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-thor{position:relative;padding:16px 44px;border:2px solid #9fb3c8;border-radius:8px;color:#e8f1ff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:4px;cursor:pointer;background:linear-gradient(#3b4a63,#1d2535);box-shadow:0 8px 20px #000a,inset 0 1px 0 #ffffff40;transition:.2s}
.b-thor i{position:absolute;top:-40px;left:50%;width:22px;height:60px;background:#dff4ff;clip-path:polygon(60% 0,20% 55%,50% 55%,30% 100%,85% 40%,55% 40%);opacity:0;filter:drop-shadow(0 0 8px #7fd8ff);transform:translateX(-50%)}
.b-thor i:nth-child(2){left:20%;top:-30px;height:44px}.b-thor i:nth-child(3){left:80%;top:-34px;height:50px}
.b-thor:hover i{animation:thor-flash .5s infinite}.b-thor:hover i:nth-child(2){animation-delay:.15s}.b-thor:hover i:nth-child(3){animation-delay:.3s}
.b-thor:hover{box-shadow:0 0 30px #7fd8ff,0 8px 20px #000a;border-color:#dff4ff;text-shadow:0 0 10px #fff}
@keyframes thor-flash{0%,100%{opacity:0}10%,30%{opacity:1}20%{opacity:.3}}
</style>
</head>
<body>
<button class="b-thor"><i></i><i></i><i></i>THOR</button>

</body>
</html>

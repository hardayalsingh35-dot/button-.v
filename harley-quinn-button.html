<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harley Quinn — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a0c10; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-harley{position:relative;padding:16px 44px;border:0;border-radius:12px;color:#fff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(90deg,#d7262e 50%,#111 50%);box-shadow:0 10px 30px #000;transition:.3s;transform-origin:top center}
.b-harley::before,.b-harley::after{content:"";position:absolute;top:50%;width:14px;height:14px;transform:translateY(-50%) rotate(45deg)}
.b-harley::before{left:12px;background:#111}.b-harley::after{right:12px;background:#d7262e}
.b-harley:hover{animation:swing 1s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
</style>
</head>
<body>
<button class="b-harley">PUDDIN'</button>

</body>
</html>

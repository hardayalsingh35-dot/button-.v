<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batman Bat Signal — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-bat{position:relative;padding:16px 44px;border:0;border-radius:10px;color:#ffd84a;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:4px;cursor:pointer;background:#111318;box-shadow:0 10px 30px #000,inset 0 0 0 1px #2a2f3a;transition:.4s}
.b-bat::before{content:"";position:absolute;inset:-40px -60px;border-radius:50%;background:radial-gradient(ellipse,#ffe98a55,transparent 70%);opacity:0;transition:.4s;z-index:-1}
.b-bat i{position:absolute;left:50%;top:50%;width:64px;height:34px;background:#111;transform:translate(-50%,-50%) scale(.3);opacity:0;clip-path:polygon(0 35%,15% 20%,28% 32%,38% 20%,44% 30%,50% 0,56% 30%,62% 20%,72% 32%,85% 20%,100% 35%,78% 60%,70% 100%,60% 75%,50% 90%,40% 75%,30% 100%,22% 60%);transition:.4s}
.b-bat span{transition:.2s}
.b-bat:hover{background:#ffd84a;box-shadow:0 0 40px #ffd84a88,0 10px 30px #000}
.b-bat:hover::before{opacity:1}.b-bat:hover i{opacity:1;transform:translate(-50%,-50%) scale(1)}.b-bat:hover span{opacity:0}
</style>
</head>
<body>
<button class="b-bat"><i></i><span>BATMAN</span></button>

</body>
</html>

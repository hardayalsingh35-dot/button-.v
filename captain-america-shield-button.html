<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captain America Shield — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a2e; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-cap{position:relative;width:110px;height:110px;border-radius:50%;border:0;cursor:pointer;background:repeating-radial-gradient(circle,#1f4fd6 0 22px,#f4f4f4 22px 33px,#d7262e 33px 44px,#f4f4f4 44px 52px,#d7262e 52px 100px);box-shadow:0 10px 25px #0009,inset 0 0 0 2px #0003;transition:transform .7s cubic-bezier(.2,1.4,.4,1)}
.b-cap::before{content:"";position:absolute;inset:0;background:#fff;clip-path:polygon(50% 36%,53.5% 46%,63% 46%,55.5% 52.5%,58.5% 62.5%,50% 56.5%,41.5% 62.5%,44.5% 52.5%,37% 46%,46.5% 46%)}
.b-cap:hover{transform:rotate(360deg) scale(1.08)}.b-cap:active{transform:scale(.9)}
</style>
</head>
<body>
<button class="b-cap" aria-label="Shield"></button>

</body>
</html>

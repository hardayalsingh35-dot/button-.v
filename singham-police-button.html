<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singham Police — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #15120c; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-singham{position:relative;padding:16px 44px 16px 60px;border:0;border-radius:8px;color:#fff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#8a6a3a,#5a4220);box-shadow:0 6px 0 #2e2010,0 12px 24px #0008;transition:.15s}
.b-singham i{position:absolute;left:18px;top:50%;width:26px;height:26px;background:#ffd84a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transform:translateY(-50%)}
.b-singham::after{content:"AATA MAJHI SATAKLI!";position:absolute;left:50%;top:-30px;transform:translateX(-50%) scale(0);white-space:nowrap;font-size:12px;letter-spacing:1px;color:#ffd84a;background:#111;padding:4px 10px;border-radius:6px;transition:.3s cubic-bezier(.3,1.6,.5,1)}
.b-singham:hover::after{transform:translateX(-50%) scale(1)}
.b-singham:hover{animation:roar .1s infinite}
@keyframes roar{50%{transform:translate(2px,-1px)}}
</style>
</head>
<body>
<button class="b-singham"><i></i>SINGHAM</button>

</body>
</html>

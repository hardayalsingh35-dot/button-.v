<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05070f; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-neon{padding:14px 40px;background:transparent;border:2px solid #0ff;color:#0ff;border-radius:8px;font:700 16px/1 "Segoe UI",sans-serif;letter-spacing:3px;cursor:pointer;box-shadow:0 0 10px #0ff,inset 0 0 10px #0ff4;text-shadow:0 0 8px #0ff;transition:.3s;animation:neon-flicker 3s infinite}
.b-neon:hover{background:#0ff;color:#002;box-shadow:0 0 20px #0ff,0 0 60px #0ff;text-shadow:none}
@keyframes neon-flicker{0%,95%,100%{opacity:1}96%{opacity:.6}97%{opacity:1}98%{opacity:.4}}
</style>
</head>
<body>
<button class="b-neon">NEON</button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luffy Gum Gum Stretch — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1a26; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-luffy{position:relative;padding:16px 44px;border:0;border-radius:40px;color:#fff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#e8232a,#b3121a);box-shadow:0 6px 0 #5a0408,0 12px 24px #0008;transition:transform .5s cubic-bezier(.3,1.8,.5,1)}
.b-luffy i{position:absolute;left:50%;top:-16px;width:50px;height:14px;transform:translateX(-50%);background:#f5c542;border-radius:50% 50% 0 0;box-shadow:inset 0 -4px 0 #d7262e}
.b-luffy:hover{transform:scaleX(1.6)}.b-luffy:active{transform:scaleX(.8) scaleY(1.3)}
</style>
</head>
<body>
<button class="b-luffy"><i></i>GUM GUM</button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolverine Claws — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1608; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-wolv{position:relative;padding:16px 44px 16px 74px;border:0;border-radius:10px;color:#1a1a1a;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#ffd400,#e0a800);box-shadow:0 6px 0 #1f3fa8,0 12px 24px #0008;transition:.15s}
.b-wolv i{position:absolute;left:24px;bottom:50%;width:4px;height:0;background:linear-gradient(#fff,#9aa);border-radius:2px 2px 0 0;transform:rotate(-15deg);transform-origin:bottom;transition:height .12s;box-shadow:0 0 4px #fff}
.b-wolv i:nth-child(2){left:36px;transition-delay:.05s}.b-wolv i:nth-child(3){left:48px;transition-delay:.1s}
.b-wolv:hover i{height:38px}.b-wolv:hover{letter-spacing:5px}
.b-wolv:active{transform:translateY(4px);box-shadow:0 2px 0 #1f3fa8}
</style>
</head>
<body>
<button class="b-wolv"><i></i><i></i><i></i>SNIKT</button>

</body>
</html>

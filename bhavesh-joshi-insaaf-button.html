<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhavesh Joshi Insaaf — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121212; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-bj{position:relative;padding:16px 44px;border:2px solid #fff;border-radius:10px;color:#fff;font:900 16px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:#000;box-shadow:0 10px 30px #000;overflow:hidden}
.b-bj::before{content:"INSAAF";position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:#000;transform:translateY(100%);transition:.3s;letter-spacing:6px}
.b-bj:hover::before{transform:translateY(0)}
</style>
</head>
<body>
<button class="b-bj">BHAVESH JOSHI</button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Share Icons Expand — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1624; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-share{position:relative;padding:14px 36px;border:0;border-radius:40px;background:#3b82f6;color:#fff;font:700 15px "Segoe UI",sans-serif;cursor:pointer;transition:.3s}
.b-share i{position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px;border-radius:50%;display:grid;place-items:center;font:700 13px sans-serif;font-style:normal;color:#fff;transform:scale(0);transition:.4s cubic-bezier(.3,1.6,.5,1);z-index:-1}
.b-share:hover i:nth-child(1){transform:translate(-80px,-40px) scale(1);background:#1877f2}
.b-share:hover i:nth-child(2){transform:translate(0,-58px) scale(1);background:#111;transition-delay:.05s}
.b-share:hover i:nth-child(3){transform:translate(80px,-40px) scale(1);background:#e1306c;transition-delay:.1s}
.b-share:hover{background:#2563eb}
</style>
</head>
<body>
<button class="b-share"><i>f</i><i>X</i><i>ig</i>Share</button>

</body>
</html>

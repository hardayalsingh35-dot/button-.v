<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Commando Dhruva — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141a2e; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-dhruva{position:relative;padding:16px 44px 16px 56px;border:0;border-radius:12px;color:#102a6b;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#ffd84a,#f0b400);box-shadow:0 6px 0 #8a6400,0 12px 24px #0008;transition:.15s}
.b-dhruva i{position:absolute;left:16px;top:50%;width:28px;height:28px;background:#1f3fa8;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transform:translateY(-50%);transition:.5s cubic-bezier(.3,1.5,.5,1)}
.b-dhruva::before{content:"";position:absolute;inset:-30px;background:repeating-conic-gradient(#ffd84a33 0 6deg,transparent 6deg 20deg);border-radius:50%;opacity:0;transition:.3s;z-index:-1}
.b-dhruva:hover i{transform:translateY(-50%) rotate(360deg) scale(1.3);filter:drop-shadow(0 0 8px #1f3fa8)}
.b-dhruva:hover::before{opacity:1;animation:dh-spin 4s linear infinite}
.b-dhruva:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6400}
@keyframes dh-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<button class="b-dhruva"><i></i>DHRUVA</button>

</body>
</html>

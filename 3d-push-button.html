<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Push — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b1d2a; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-push{padding:14px 40px;border:0;border-radius:12px;background:#ff5a5f;color:#fff;font:800 16px "Segoe UI",sans-serif;cursor:pointer;box-shadow:0 8px 0 #b33035,0 12px 20px #0006;transition:.08s}
.b-push:active{transform:translateY(8px);box-shadow:0 0 0 #b33035,0 2px 6px #0006}
</style>
</head>
<body>
<button class="b-push">Press Me</button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vegeta Over 9000 — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1222; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-vegeta{position:relative;padding:16px 44px;border:0;border-radius:10px;color:#fff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#f4f4f4 0 35%,#1f3fa8 35%);box-shadow:0 6px 0 #0d2466,0 12px 24px #0008;transition:.3s}
.b-vegeta::after{content:"IT'S OVER 9000!";position:absolute;left:50%;top:-30px;transform:translateX(-50%) scale(0);white-space:nowrap;font-size:12px;color:#ffd54a;background:#111;padding:4px 10px;border-radius:6px;transition:.3s cubic-bezier(.3,1.6,.5,1)}
.b-vegeta:hover::after{transform:translateX(-50%) scale(1)}
.b-vegeta:hover{box-shadow:0 6px 0 #0d2466,0 0 40px #4f9bff;text-shadow:0 0 10px #4f9bff}
</style>
</head>
<body>
<button class="b-vegeta">VEGETA</button>

</body>
</html>

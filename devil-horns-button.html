<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devil Horns — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c0608; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-devil{position:relative;padding:16px 44px;border:3px solid #3d0205;border-radius:40px;color:#ffe9d6;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:4px;cursor:pointer;background:linear-gradient(#e3262f,#8e0a10);box-shadow:0 0 20px #ff1e1e55;transition:.3s}
.b-devil i{position:absolute;top:-4px;width:18px;height:26px;background:linear-gradient(#ffb080,#8e0a10);clip-path:polygon(50% 0,100% 100%,0 100%);transform:translateY(20px) scale(.3);transition:.4s cubic-bezier(.3,1.8,.5,1)}
.b-devil i:first-child{left:20px}.b-devil i:nth-child(2){right:20px}
.b-devil:hover i:first-child{transform:translateY(-22px) rotate(-15deg)}.b-devil:hover i:nth-child(2){transform:translateY(-22px) rotate(15deg)}
.b-devil::after{content:"";position:absolute;left:10%;right:10%;bottom:-6px;height:34px;background:radial-gradient(circle at 20% 100%,#ff9d1a 20%,transparent 40%),radial-gradient(circle at 50% 100%,#ff5a1a 25%,transparent 45%),radial-gradient(circle at 80% 100%,#ff9d1a 20%,transparent 40%);opacity:0;z-index:-1;filter:blur(2px);transition:.3s;transform-origin:bottom}
.b-devil:hover::after{opacity:1;animation:fl .3s infinite alternate}
.b-devil:hover{box-shadow:0 0 40px #ff3b1e;animation:dshake .25s infinite}
@keyframes fl{to{transform:scaleY(1.4)}}@keyframes dshake{25%{transform:translate(1px,-1px)}75%{transform:translate(-1px,1px)}}
</style>
</head>
<body>
<button class="b-devil"><i></i><i></i>DEVIL</button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Switch Toggle — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b10; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-toggle{position:relative;width:74px;height:38px;border:0;border-radius:20px;background:#4b5563;cursor:pointer;transition:.3s;box-shadow:inset 0 2px 6px #0006}
.b-toggle::before{content:"";position:absolute;left:4px;top:4px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0006;transition:.3s}
.b-toggle.on{background:#f5b301;box-shadow:inset 0 2px 6px #0004,0 0 30px #ffd54a}
.b-toggle.on::before{left:40px}
.stage.lit{background:radial-gradient(circle,#4a4030,#1c1a16)!important}
</style>
</head>
<body>
<button class="b-toggle" aria-label="Light switch" onclick="this.classList.toggle('on');this.parentElement.classList.toggle('lit')"></button>

</body>
</html>

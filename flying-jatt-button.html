<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flying Jatt — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1430; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-jatt{position:relative;padding:16px 44px;border:0;border-radius:12px;color:#fff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#1f3fa8,#0f2266);box-shadow:0 6px 0 #081233,0 12px 24px #0008;transition:.4s cubic-bezier(.3,1.5,.5,1)}
.b-jatt i{position:absolute;left:50%;top:-16px;width:46px;height:22px;transform:translateX(-50%);background:linear-gradient(#ff7a1a,#e04e00);border-radius:50% 50% 10% 10%;box-shadow:inset 0 -4px 0 #0003}
.b-jatt::before{content:"";position:absolute;right:100%;top:30%;bottom:30%;width:0;margin-right:10px;background:repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 9px);opacity:0;transition:.3s}
.b-jatt:hover{transform:translate(14px,-14px) rotate(-6deg)}.b-jatt:hover::before{width:50px;opacity:.8}
</style>
</head>
<body>
<button class="b-jatt"><i></i>FLYING JATT</button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brushed Metal — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c1c1c; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-metal{padding:14px 44px;border:1px solid #555;border-radius:10px;color:#ddd;font:700 16px "Segoe UI",sans-serif;letter-spacing:2px;cursor:pointer;background:repeating-linear-gradient(90deg,#8a8a8a 0 1px,#9c9c9c 1px 2px,#7d7d7d 2px 3px),linear-gradient(#aaa,#666);background-blend-mode:overlay;text-shadow:0 -1px 0 #000,0 1px 0 #fff4;box-shadow:inset 0 2px 0 #fff6,inset 0 -2px 4px #0008,0 6px 14px #000a;transition:.1s}
.b-metal:hover{filter:brightness(1.15)}
.b-metal:active{box-shadow:inset 0 3px 8px #000c,0 1px 2px #000;transform:translateY(1px)}
</style>
</head>
<body>
<button class="b-metal">METAL</button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.One Ra.One HART — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06101f; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-gone{position:relative;padding:16px 44px 16px 64px;border:0;border-radius:12px;color:#bfe9ff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#0b2a5c,#061634);box-shadow:0 10px 30px #000,inset 0 0 0 1px #1f6fd0;overflow:hidden;transition:.3s}
.b-gone::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 12px,#1f6fd044 12px 13px),repeating-linear-gradient(0deg,transparent 0 12px,#1f6fd044 12px 13px)}
.b-gone i{position:absolute;left:24px;top:50%;width:20px;height:20px;background:#35c3ff;transform:translateY(-60%) rotate(45deg);box-shadow:0 0 14px #35c3ff;animation:hart 1.2s infinite}
.b-gone i::before,.b-gone i::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#35c3ff}
.b-gone i::before{left:-10px}.b-gone i::after{top:-10px}
.b-gone:hover i{animation-duration:.4s}.b-gone:hover{box-shadow:0 0 30px #35c3ff88,inset 0 0 0 1px #35c3ff;color:#fff}
.b-gone span{position:relative}
@keyframes hart{50%{transform:translateY(-60%) rotate(45deg) scale(1.2)}}
</style>
</head>
<body>
<button class="b-gone"><i></i><span>G.ONE</span></button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet Witch Chaos Magic — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a0810; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-wanda{position:relative;overflow:hidden;padding:16px 44px;border:0;border-radius:12px;color:#ffb3c1;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#a3122a,#5a0718);box-shadow:0 0 0 2px #ff2a5a55,0 10px 30px #000;transition:.3s}
.b-wanda::before{content:"";position:absolute;inset:-60%;background:conic-gradient(#ff2a5a,transparent 30%,#ff2a5a 50%,transparent 80%,#ff2a5a);opacity:0;mix-blend-mode:screen;animation:wanda 2s linear infinite;transition:.3s}
.b-wanda:hover::before{opacity:.8}.b-wanda:hover{color:#fff;text-shadow:0 0 12px #ff2a5a;box-shadow:0 0 0 2px #ff2a5a,0 0 30px #ff2a5a88}
.b-wanda span{position:relative}
@keyframes wanda{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<button class="b-wanda"><span>CHAOS MAGIC</span></button>

</body>
</html>

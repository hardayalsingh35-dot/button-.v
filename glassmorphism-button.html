<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg,#ff6ec4,#7873f5 60%,#4ff3ff); font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-glass{padding:14px 40px;border:1px solid #fff5;border-radius:14px;background:#ffffff22;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:600 16px "Segoe UI",sans-serif;cursor:pointer;box-shadow:0 8px 32px #0004,inset 0 1px 0 #fff6;transition:.3s}
.b-glass:hover{background:#ffffff38;transform:translateY(-2px)}
</style>
</head>
<body>
<button class="b-glass">Glass Button</button>

</body>
</html>

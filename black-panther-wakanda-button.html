<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Panther Wakanda — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #120d1c; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-bp{position:relative;padding:16px 44px;border:0;border-radius:12px;color:#d9c7ff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:4px;cursor:pointer;background:#0d0a14;box-shadow:0 0 0 1px #4b2a8a,0 10px 30px #000;overflow:hidden;transition:.3s}
.b-bp::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,#7a3cff22 6px 7px),repeating-linear-gradient(0deg,transparent 0 6px,#7a3cff22 6px 7px)}
.b-bp::after{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 70%,#a76bff 85%,transparent 100%);opacity:0;animation:bp-spin 1.2s linear infinite;mix-blend-mode:screen}
.b-bp:hover::after{opacity:1}.b-bp:hover{box-shadow:0 0 0 1px #a76bff,0 0 30px #7a3cff99,0 10px 30px #000;color:#fff;text-shadow:0 0 12px #a76bff}
.b-bp span{position:relative;z-index:1}
@keyframes bp-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<button class="b-bp"><span>WAKANDA</span></button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Speed — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c0e0e; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-flash{position:relative;padding:16px 44px 16px 60px;border:0;border-radius:40px;color:#ffe600;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#e8232a,#9c0b12);box-shadow:0 6px 0 #4a0408;transition:.2s}
.b-flash i{position:absolute;left:18px;top:50%;width:22px;height:30px;background:#ffe600;clip-path:polygon(60% 0,20% 55%,50% 55%,30% 100%,85% 40%,55% 40%);transform:translateY(-50%)}
.b-flash::before{content:"";position:absolute;right:100%;top:20%;bottom:20%;width:0;margin-right:10px;background:repeating-linear-gradient(0deg,#ffe600 0 3px,transparent 3px 10px);opacity:0;transition:.2s;border-radius:4px}
.b-flash:hover::before{width:60px;opacity:.9;animation:streak .3s infinite}
.b-flash:hover{transform:translateX(16px) skewX(-8deg);box-shadow:-12px 6px 0 #ffe60044,-24px 6px 0 #ffe60022,0 6px 0 #4a0408}
@keyframes streak{to{transform:translateX(-14px)}}
</style>
</head>
<body>
<button class="b-flash"><i></i>FLASH</button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groot — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1a0c; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-groot{position:relative;padding:16px 44px;border:2px solid #2d1a0a;border-radius:14px;color:#dfe7c8;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:repeating-linear-gradient(90deg,#7a4a2a 0 6px,#6a3e22 6px 9px);box-shadow:0 10px 30px #000;transition:.3s}
.b-groot i{position:absolute;top:-6px;width:16px;height:16px;background:#3fbf4a;border-radius:0 100% 0 100%;transform:scale(0);transition:.4s cubic-bezier(.3,1.6,.5,1)}
.b-groot i:nth-child(1){left:15%}.b-groot i:nth-child(2){left:45%;transition-delay:.1s}.b-groot i:nth-child(3){left:75%;transition-delay:.2s}
.b-groot:hover i{transform:scale(1) translateY(-10px) rotate(-20deg)}.b-groot:hover{box-shadow:0 10px 30px #000,0 0 20px #3fbf4a66}
</style>
</head>
<body>
<button class="b-groot"><i></i><i></i><i></i>I AM GROOT</button>

</body>
</html>

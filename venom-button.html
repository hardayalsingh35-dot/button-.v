<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venom — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b1b26; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-venom{position:relative;padding:16px 44px;background:#08080b;color:#cfcfd8;border:0;border-radius:14px;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:4px;cursor:pointer;box-shadow:0 10px 30px #000;transition:.3s}
.b-venom i{position:absolute;bottom:-2px;width:10px;height:0;background:#08080b;border-radius:0 0 8px 8px;transition:height .5s;transform-origin:top}
.b-venom i:nth-of-type(1){left:20%}.b-venom i:nth-of-type(2){left:50%;transition-delay:.1s}.b-venom i:nth-of-type(3){left:75%;transition-delay:.2s}
.b-venom:hover i{height:34px;animation:v-drip 1.4s infinite}
.b-venom em{position:absolute;top:50%;width:26px;height:16px;background:#fff;opacity:0;transform:translateY(-50%) scaleX(.2);transition:.3s;clip-path:polygon(0 60%,18% 18%,60% 0,100% 35%,82% 85%,40% 100%)}
.b-venom em:first-child{left:8px}.b-venom em:last-of-type{right:8px;transform:translateY(-50%) scaleX(-.2)}
.b-venom:hover em{opacity:1;transform:translateY(-50%) scaleX(1)}.b-venom:hover em:last-of-type{transform:translateY(-50%) scaleX(-1)}
.b-venom:hover{color:#fff;box-shadow:0 10px 40px #000,0 0 30px #2a2a40;animation:v-wob 1.5s infinite}
@keyframes v-drip{50%{transform:scaleY(1.4)}}
@keyframes v-wob{50%{border-radius:22px 10px 20px 12px}}
</style>
</head>
<body>
<button class="b-venom"><em></em>VENOM<em></em><i></i><i></i><i></i></button>

</body>
</html>

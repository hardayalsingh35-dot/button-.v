<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripple Material — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #15121f; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-ripple{position:relative;overflow:hidden;padding:14px 40px;border:0;border-radius:8px;background:#6200ee;color:#fff;font:600 16px "Segoe UI",sans-serif;cursor:pointer;box-shadow:0 4px 12px #6200ee66}
.b-ripple .r{position:absolute;border-radius:50%;background:#fff8;transform:scale(0);animation:ripple .6s linear;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
</style>
</head>
<body>
<button class="b-ripple" data-ripple="">Click for ripple</button>
<script>
document.querySelectorAll('[data-ripple]').forEach(b=>b.addEventListener('click',e=>{const r=document.createElement('span');r.className='r';const d=Math.max(b.clientWidth,b.clientHeight),rect=b.getBoundingClientRect();r.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-rect.left-d/2)+'px;top:'+(e.clientY-rect.top-d/2)+'px';b.appendChild(r);r.addEventListener('animationend',()=>r.remove());}));
</script>
</body>
</html>

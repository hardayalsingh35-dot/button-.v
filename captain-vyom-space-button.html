<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captain Vyom Space — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05081a; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-vyom{position:relative;overflow:hidden;padding:16px 44px;border:0;border-radius:12px;color:#cfe6ff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:radial-gradient(circle at 20% 30%,#fff 1px,transparent 2px),radial-gradient(circle at 70% 60%,#fff 1px,transparent 2px),radial-gradient(circle at 45% 80%,#fff 1px,transparent 2px),radial-gradient(circle at 85% 20%,#fff 1px,transparent 2px),linear-gradient(#0b1a4a,#040a22);box-shadow:0 10px 30px #000,inset 0 0 0 1px #3b6fd1;transition:.3s}
.b-vyom::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 18px,#fff8 18px 19px);opacity:0;transform:scaleX(.2);transition:.3s}
.b-vyom:hover::before{opacity:1;transform:scaleX(1);animation:warp .3s linear infinite}
.b-vyom:hover{box-shadow:0 0 30px #3b6fd188,inset 0 0 0 1px #7fb2ff;color:#fff}
.b-vyom span{position:relative}
@keyframes warp{to{background-position:38px 0}}
</style>
</head>
<body>
<button class="b-vyom"><span>CAPTAIN VYOM</span></button>

</body>
</html>

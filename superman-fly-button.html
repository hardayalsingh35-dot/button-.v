<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superman Fly — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a2a4a; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-sup{position:relative;padding:16px 44px;border:0;border-radius:10px;color:#ffd84a;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:4px;cursor:pointer;background:linear-gradient(#2f6fe4,#1a3fa8);box-shadow:0 6px 0 #0d2466,0 12px 24px #0008;transition:transform .4s cubic-bezier(.3,1.5,.5,1),box-shadow .4s}
.b-sup::before{content:"";position:absolute;left:10%;right:10%;top:60%;height:40px;background:#d7262e;z-index:-1;border-radius:0 0 50% 50%;transform:scaleY(.2);transform-origin:top;transition:.4s}
.b-sup i{display:inline-block;width:20px;height:20px;background:#d7262e;clip-path:polygon(50% 0,100% 30%,50% 100%,0 30%);vertical-align:-3px;margin-right:8px}
.b-sup:hover{transform:translateY(-14px) rotate(-4deg);box-shadow:0 20px 0 #0d2466,0 30px 40px #0008}
.b-sup:hover::before{transform:scaleY(1) skewX(-10deg);animation:cape .5s infinite alternate}
@keyframes cape{to{transform:scaleY(1.2) skewX(10deg)}}
</style>
</head>
<body>
<button class="b-sup"><i></i>SUPERMAN</button>

</body>
</html>

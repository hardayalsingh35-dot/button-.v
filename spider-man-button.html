<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spider-Man — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14203a; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-spidey{position:relative;padding:16px 40px 16px 56px;border:0;border-radius:40px;color:#fff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:radial-gradient(circle at 30% 20%,#ff3b3b,#d60f0f 45%,#8e0000);box-shadow:0 6px 0 #5a0000,0 12px 24px #0008;overflow:hidden;transition:.15s}
.b-spidey::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 25% 50%,transparent 0 9px,#0009 9px 10.5px),repeating-conic-gradient(from 0deg at 25% 50%,#0009 0 2deg,transparent 2deg 30deg);-webkit-mask:linear-gradient(90deg,#000 30%,transparent 90%);mask:linear-gradient(90deg,#000 30%,transparent 90%)}
.b-spidey::after{content:"";position:absolute;right:0;top:0;bottom:0;width:50px;background:linear-gradient(90deg,transparent,#1f3fa8 60%,#142a75)}
.b-spidey i{position:absolute;left:14px;top:50%;width:30px;height:18px;background:#fff;border:3px solid #000;border-radius:90% 10% 40% 60%/70% 30% 70% 30%;transform:translateY(-50%) rotate(-10deg);transition:.25s;z-index:1}
.b-spidey:hover i{transform:translateY(-50%) rotate(-10deg) scaleY(.5)}
.b-spidey span{position:relative;z-index:1;text-shadow:2px 2px 0 #000}
.b-spidey:active{transform:translateY(4px);box-shadow:0 2px 0 #5a0000}
</style>
</head>
<body>
<button class="b-spidey"><i></i><span>SPIDEY</span></button>

</body>
</html>

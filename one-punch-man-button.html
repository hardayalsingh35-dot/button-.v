<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Punch Man — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1a10; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-opm{position:relative;padding:16px 44px;border:0;border-radius:12px;color:#2a1a00;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#ffd400,#f0a800);box-shadow:0 6px 0 #a83a00,0 12px 24px #0008;transition:.1s}
.b-opm::before{content:"";position:absolute;inset:0;border-radius:12px;border:4px solid #e82a2a;opacity:0}
.b-opm:active::before{animation:impact .4s ease-out}
.b-opm:active{transform:translateX(30px) scale(.95)}
@keyframes impact{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.8)}}
</style>
</head>
<body>
<button class="b-opm">OK.</button>

</body>
</html>

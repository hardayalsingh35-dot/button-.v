<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chacha Chaudhary — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c1408; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-chacha{position:relative;padding:16px 44px;border:0;border-radius:12px;color:#3a1d00;font:900 16px/1 Impact,"Arial Black",sans-serif;letter-spacing:2px;cursor:pointer;background:linear-gradient(#ffd27a,#f0b040);box-shadow:0 6px 0 #a85a0a,0 12px 24px #0008;transition:.15s}
.b-chacha i{position:absolute;left:50%;top:-18px;width:52px;height:24px;transform:translateX(-50%);background:linear-gradient(#e8232a,#9c0b12);border-radius:50% 50% 12% 12%;box-shadow:inset 0 -4px 0 #0003}
.b-chacha::after{content:"💡";position:absolute;right:-10px;top:-26px;font-size:22px;opacity:0;transform:scale(0);transition:.3s cubic-bezier(.3,1.6,.5,1)}
.b-chacha:hover::after{opacity:1;transform:scale(1);filter:drop-shadow(0 0 8px #ffd54a)}
.b-chacha:hover{box-shadow:0 6px 0 #a85a0a,0 0 30px #ffd54a88}
</style>
</head>
<body>
<button class="b-chacha"><i></i>CHACHA CHAUDHARY</button>

</body>
</html>

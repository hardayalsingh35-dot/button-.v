<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiny Gold — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141008; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-gold{position:relative;overflow:hidden;padding:14px 44px;border:0;border-radius:40px;color:#3a2a00;font:900 16px "Segoe UI",sans-serif;letter-spacing:2px;cursor:pointer;background:linear-gradient(135deg,#f6e27a,#d4a017 45%,#f9efb0 50%,#b8860b 55%,#f6e27a);box-shadow:0 8px 20px #0008,inset 0 1px 0 #fff8;transition:.3s}
.b-gold::before{content:"";position:absolute;top:-50%;bottom:-50%;width:30px;left:-50px;background:#fffa;transform:skewX(-25deg);animation:gshine 2.5s infinite}
.b-gold:hover{transform:translateY(-2px);box-shadow:0 12px 26px #0008,0 0 30px #f6e27a88}
@keyframes gshine{0%{left:-50px}40%,100%{left:120%}}
</style>
</head>
<body>
<button class="b-gold">PREMIUM</button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goku Super Saiyan — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1020; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-goku{position:relative;padding:16px 44px;border:0;border-radius:12px;color:#fff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#ff8a1f,#e05a00);box-shadow:0 6px 0 #1f3fa8,0 12px 24px #0008;transition:.3s}
.b-goku::before{content:"";position:absolute;inset:-34px -22px -8px;border-radius:50% 50% 40% 40%;background:radial-gradient(ellipse at 50% 100%,#ffd54a,#ffb300 40%,transparent 70%);opacity:0;transition:.3s;z-index:-1;filter:blur(4px);transform-origin:bottom}
.b-goku:hover::before{opacity:1;animation:aura .25s infinite alternate}
.b-goku:hover{color:#fff7c2;text-shadow:0 0 12px #ffd54a;box-shadow:0 6px 0 #1f3fa8,0 0 40px #ffd54a}
@keyframes aura{to{transform:scaleY(1.3) scaleX(1.06)}}
</style>
</head>
<body>
<button class="b-goku">KAMEHAMEHA</button>

</body>
</html>

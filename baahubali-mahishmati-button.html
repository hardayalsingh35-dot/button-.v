<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baahubali Mahishmati — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c1208; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-baahu{position:relative;padding:16px 44px;border:0;border-radius:6px;color:#3a1d00;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:4px;cursor:pointer;background:linear-gradient(135deg,#ffe08a,#d4a017 50%,#ffd666);box-shadow:0 0 0 2px #7a4a00,0 0 0 5px #ffd666,0 10px 30px #000;overflow:hidden;transition:.3s}
.b-baahu::before{content:"";position:absolute;top:-50%;bottom:-50%;width:30px;left:-50px;background:#fff8;transform:skewX(-25deg)}
.b-baahu:hover::before{left:120%;transition:left .6s}
.b-baahu::after{content:"";position:absolute;right:-20px;top:-20px;width:60px;height:60px;border-radius:50%;background:repeating-conic-gradient(#b8860b 0 10deg,transparent 10deg 20deg);opacity:.35}
.b-baahu:hover{letter-spacing:6px;box-shadow:0 0 0 2px #7a4a00,0 0 0 5px #ffd666,0 0 30px #ffd666,0 10px 30px #000}
</style>
</head>
<body>
<button class="b-baahu">BAAHUBALI</button>

</body>
</html>

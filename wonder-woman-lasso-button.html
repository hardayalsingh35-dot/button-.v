<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wonder Woman Lasso — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c1420; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-ww{position:relative;padding:16px 44px;border:0;border-radius:12px;color:#ffe08a;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:4px;cursor:pointer;background:linear-gradient(#b3202c,#6e0f18);box-shadow:0 0 0 3px #e9b949,0 10px 30px #000;transition:.3s}
.b-ww::before{content:"";position:absolute;inset:-16px;border:4px solid #ffd766;border-radius:50px;opacity:0;transform:scale(1.3);box-shadow:0 0 14px #ffd766;transition:.3s;pointer-events:none}
.b-ww:hover::before{opacity:1;animation:lasso 1.6s linear infinite}
.b-ww:hover{text-shadow:0 0 12px #ffd766}
@keyframes lasso{from{transform:rotateX(60deg) rotate(0)}to{transform:rotateX(60deg) rotate(360deg)}}
</style>
</head>
<body>
<button class="b-ww">WONDER</button>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro 8-bit Pixel — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1a2e; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-pixel{padding:14px 36px;border:0;background:#4ade80;color:#052e16;font:700 14px "Courier New",monospace;cursor:pointer;box-shadow:0 -4px 0 0 #052e16,0 4px 0 0 #052e16,4px 0 0 0 #052e16,-4px 0 0 0 #052e16,4px 4px 0 0 #052e16,8px 8px 0 0 #166534;image-rendering:pixelated;transition:none}
.b-pixel:hover{background:#86efac}
.b-pixel:active{transform:translate(4px,4px);box-shadow:0 -4px 0 0 #052e16,0 4px 0 0 #052e16,4px 0 0 0 #052e16,-4px 0 0 0 #052e16}
</style>
</head>
<body>
<button class="b-pixel">&gt; START GAME</button>

</body>

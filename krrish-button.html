<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krrish — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-krrish{position:relative;padding:16px 44px 16px 60px;border:0;border-radius:12px;color:#9fd3ff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#1b1b22,#0a0a0e);box-shadow:0 10px 30px #000,inset 0 0 0 1px #2a3a55;transition:.4s cubic-bezier(.3,1.5,.5,1)}
.b-krrish i{position:absolute;left:14px;top:50%;width:34px;height:34px;transform:translateY(-50%);background:#111;border-radius:50% 50% 45% 45%;box-shadow:inset 0 0 0 2px #2d6bff;display:grid;place-items:center;color:#4f9bff;font:900 20px Impact,sans-serif;font-style:normal}
.b-krrish::before{content:"";position:absolute;left:15%;right:15%;top:55%;height:40px;background:#0a0a0e;border:1px solid #2d6bff55;z-index:-1;border-radius:0 0 50% 50%;transform:scaleY(.2);transform-origin:top;transition:.4s}
.b-krrish:hover{transform:translateY(-14px) rotate(-3deg);box-shadow:0 24px 30px #000,0 0 25px #2d6bff88,inset 0 0 0 1px #4f9bff;color:#fff}
.b-krrish:hover::before{transform:scaleY(1) skewX(-10deg);animation:kr-cape .5s infinite alternate}
.b-krrish:hover i{box-shadow:inset 0 0 0 2px #4f9bff,0 0 14px #4f9bff}
@keyframes kr-cape{to{transform:scaleY(1.2) skewX(10deg)}}
</style>
</head>
<body>
<button class="b-krrish"><i>K</i>KRRISH</button>

</body>
</html>

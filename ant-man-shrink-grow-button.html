<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #161016; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-ant{padding:16px 44px;border:0;border-radius:40px;color:#fff;font:900 18px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;cursor:pointer;background:linear-gradient(#e8232a,#9c0b12);box-shadow:0 0 0 3px #9aa,0 10px 30px #000;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.b-ant:hover{transform:scale(.35)}.b-ant:active{transform:scale(1.5)}

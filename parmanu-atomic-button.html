<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parmanu Atomic — Hero Buttons</title>
<!-- From Hero Buttons · MIT License · free to use -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #140a06; font-family: "Segoe UI", Arial, sans-serif; }
  .stage.lit { background: radial-gradient(circle, #4a4030, #1c1a16); }
.b-parmanu{position:relative;width:96px;height:96px;border-radius:50%;border:0;color:#fff;font:900 12px/1 Impact,"Arial Black",sans-serif;letter-spacing:2px;cursor:pointer;background:radial-gradient(circle,#ff6a00,#b32a00);box-shadow:0 0 20px #ff6a0088;transition:.3s}
.b-parmanu i{position:absolute;left:50%;top:50%;width:150px;height:56px;margin:-28px 0 0 -75px;border:2px solid #4ff3ff;border-radius:50%;opacity:.5;transition:.3s}
.b-parmanu i:nth-child(1){transform:rotate(0)}.b-parmanu i:nth-child(2){transform:rotate(60deg)}.b-parmanu i:nth-child(3){transform:rotate(120deg)}
.b-parmanu:hover i{opacity:1;box-shadow:0 0 10px #4ff3ff}
.b-parmanu:hover i:nth-child(1){animation:orb 2s linear infinite}.b-parmanu:hover i:nth-child(2){animation:orb 2s linear infinite -.66s}.b-parmanu:hover i:nth-child(3){animation:orb 2s linear infinite -1.33s}
.b-parmanu:hover{box-shadow:0 0 50px #ff6a00}
@keyframes orb{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<button class="b-parmanu"><i></i><i></i><i></i>PARMANU</button>

</body>
</html>
